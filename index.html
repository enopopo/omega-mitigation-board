<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>TOP軽減ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* Layout: 左に固定のレーン名、右に横スクロールの時間軸。最上段がボスのギミック、その下にジョブ別のスキル行。下のドックで検証・調整・入出力。 */
:root{
  --font:'Zen Maru Gothic','Zen Kaku Gothic New','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#eceff8;--panel:#ffffff;--panel2:#f3f5fc;--line:#e1e6f2;--grid:#edf0f8;--grid2:#dce1ee;
  --fg:#1d2336;--muted:#6a7391;--accent:#5a6cf0;--accent-fg:#ffffff;
  --warn:#e5484d;--warn-bg:rgba(229,72,77,.22);--ok:#23a26d;
  --aoe:#d9921a;--tb:#c44fb2;--mech:#2693a8;
  --c-sage:#4f6fe0;--c-whm:#a89a5c;--c-sch:#8a5fe0;--c-ast:#d9a400;--c-tank:#2a8fc0;--c-melee:#e0564f;--c-ranged:#e08a3c;--c-caster:#cf5fc0;
  --shadow:0 1px 2px rgba(40,52,110,.06),0 8px 24px rgba(40,52,110,.07);--shadow-s:0 1px 2px rgba(40,52,110,.08);
  --lab:112px;--rowh:34px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10131c;--panel:#181c29;--panel2:#212637;--line:#2b3248;--grid:#1c2132;--grid2:#2a3148;
    --fg:#e9ecf7;--muted:#8f98b8;--accent:#8c9bff;--accent-fg:#10142b;
    --warn:#ff6b72;--warn-bg:rgba(255,107,114,.3);--ok:#5fd3a2;
    --aoe:#e8b24a;--tb:#dc7bcb;--mech:#5cc0d2;
    --c-sage:#86a0ff;--c-whm:#e3dcb8;--c-sch:#ab88ff;--c-ast:#f0c94a;--c-tank:#5cbde4;--c-melee:#f2837b;--c-ranged:#eba05f;--c-caster:#ec8bde;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);--shadow-s:0 1px 2px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10131c;--panel:#181c29;--panel2:#212637;--line:#2b3248;--grid:#1c2132;--grid2:#2a3148;
  --fg:#e9ecf7;--muted:#8f98b8;--accent:#8c9bff;--accent-fg:#10142b;
  --warn:#ff6b72;--warn-bg:rgba(255,107,114,.3);--ok:#5fd3a2;
  --aoe:#e8b24a;--tb:#dc7bcb;--mech:#5cc0d2;
  --c-sage:#86a0ff;--c-whm:#e3dcb8;--c-sch:#ab88ff;--c-ast:#f0c94a;--c-tank:#5cbde4;--c-melee:#f2837b;--c-ranged:#eba05f;--c-caster:#ec8bde;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);--shadow-s:0 1px 2px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;line-height:1.5;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{height:100%;display:flex;flex-direction:column;min-width:0}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:4px}
.brand h1{font-size:16px;font-weight:700;margin:0;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:12px}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grp label{color:var(--muted);font-size:12px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:3px 10px;min-height:28px}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.btn.prime{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 8px;min-height:28px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--jc);display:inline-block}
.chip.sepL{margin-left:8px}
.chip[aria-pressed="false"]{opacity:.45}
.chip[aria-pressed="false"] i{background:transparent;border:1px solid var(--jc)}
select,input[type=number],input[type=text],textarea{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:3px 6px;min-height:28px}
input[type=number]{width:64px;font-family:var(--mono)}
input[type=range]{accent-color:var(--accent);width:96px}
.legend{color:var(--muted);font-size:12px;display:flex;gap:10px}
.legend b{font-weight:500}
.sampleNote{margin:0;padding:4px 16px;background:var(--panel2);color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* icons */
.ic{--sz:18px;width:var(--sz);height:var(--sz);flex:none;display:inline-grid;place-items:center;border-radius:4px;background:color-mix(in srgb,var(--jc) 30%,var(--panel2));color:var(--jc)}
.ic svg{width:calc(var(--sz) - 5px);height:calc(var(--sz) - 5px);fill:currentColor;display:block}
.ic.img{background:none;object-fit:cover;border-radius:3px}
.lab .ic{--sz:20px}
.cast{display:flex;align-items:center;gap:4px;padding:0 3px;min-width:26px}
.cast .ic{--sz:16px}
.cast .nm{overflow:hidden;text-overflow:ellipsis}
.mc .ic{--sz:16px}
.icg{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 12px;margin-top:8px}
.icr{display:flex;align-items:center;gap:8px;min-width:0}
.icr .ic{--sz:28px}
.icn{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.25}
.icn small{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#icFile{max-width:100%}

/* palette */
.pal{flex:none;background:var(--panel);border-bottom:1px solid var(--line);padding:4px 16px 6px;max-height:132px;overflow:auto}
body.dragging,body.dragging *{user-select:none!important;-webkit-user-select:none!important;cursor:grabbing!important}
.palHead{display:flex;align-items:center;gap:2px 16px;flex-wrap:wrap;margin-bottom:3px;font-size:12px;color:var(--muted)}
.palHead b{color:var(--fg);font-weight:700}
.palMsg{flex:1;min-width:180px}
.palMsg.on{color:var(--accent)}
.chk{display:inline-flex;align-items:center;gap:6px;color:var(--fg)}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.palBody{display:flex;flex-wrap:wrap;gap:4px 18px}
.pg{display:flex;align-items:flex-start;gap:6px;min-width:0}
.pgl{font-size:11px;color:var(--muted);letter-spacing:.04em;padding-top:3px;white-space:nowrap}
.pgi{display:flex;flex-wrap:wrap;gap:3px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--jc);background:color-mix(in srgb,var(--jc) 22%,var(--panel));border-radius:4px;padding:0 8px;min-height:24px;font-size:12px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:manipulation;white-space:nowrap}
.pill small{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 3px;line-height:13px}
.laneRow .track{cursor:copy}
.pill:hover{background:color-mix(in srgb,var(--jc) 36%,var(--panel))}
.pill.off{opacity:.4;text-decoration:line-through}
.pill.armed{outline:2px solid var(--accent);outline-offset:1px}
.flying{position:fixed;z-index:100;pointer-events:none;border:1px solid var(--jc);background:color-mix(in srgb,var(--jc) 45%,var(--panel));border-radius:4px;padding:2px 9px;font-size:12px;color:var(--fg);box-shadow:0 4px 14px rgba(0,0,0,.35)}
.dl{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:8;pointer-events:none}
.dl span{position:absolute;top:42px;left:6px;background:var(--accent);color:var(--accent-fg);font-family:var(--mono);font-size:11px;padding:0 5px;border-radius:3px;white-space:nowrap}
.emptyMsg{position:sticky;left:calc(var(--lab) + 16px);display:inline-block;padding:26px 0 0;color:var(--muted)}

/* timeline */
.stage{flex:1;min-height:200px;position:relative;min-width:0}
.scroller{position:absolute;inset:0;overflow:auto;background:var(--bg)}
.scroller.panning,.scroller.panning *{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important}
.canvas{position:relative;isolation:isolate;min-height:100%}
.row{display:flex;width:100%;border-bottom:1px solid var(--line);height:var(--rowh)}
.lab{position:sticky;left:0;z-index:5;flex:none;width:var(--lab);background:var(--panel);border-right:1px solid var(--line);padding:0 8px;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap}
.lab small{color:var(--muted);font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 3px;line-height:14px}
.lab span.n{overflow:hidden;text-overflow:ellipsis}
.track{position:relative;flex:none;
  background-image:linear-gradient(to right,var(--grid2) 1px,transparent 1px),linear-gradient(to right,var(--grid) 1px,transparent 1px);
  background-size:calc(var(--pps)*60px) 100%,calc(var(--pps)*10px) 100%;cursor:copy}
.ruler{position:sticky;top:0;z-index:6;height:60px;background:var(--panel)}
.ruler .lab{z-index:7;color:var(--muted);font-size:11px}
.ruler .track{cursor:default;background-image:none}
.tick{position:absolute;top:2px;font-family:var(--mono);font-size:10px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.tick.m{color:var(--fg)}
.tick.z{transform:none;left:4px!important}
.etime{position:absolute;top:40px;height:18px;border-left:2px solid var(--evc);padding-left:3px;font-family:var(--mono);font-size:10px;line-height:18px;color:var(--evc);white-space:nowrap}
.phase{position:absolute;top:20px;height:18px;padding:0 6px;font-size:11px;font-weight:700;color:var(--accent);border-left:2px solid var(--accent);white-space:nowrap;line-height:18px}
.boss .track{cursor:default}
.ev{position:absolute;z-index:2;cursor:pointer}
.ev i{display:block;height:5px;background:var(--evc);border-radius:1px;min-width:5px}
.ev b{display:block;margin-top:3px;font-weight:500;font-size:11px;white-space:nowrap;color:var(--fg)}
.t-aoe{--evc:var(--aoe)}.t-tb{--evc:var(--tb)}.t-mech{--evc:var(--mech)}
.ev b em{font-style:normal;color:var(--evc);margin-right:3px}
.grouprow{height:26px;background:var(--panel2)}
.grouprow .lab{background:var(--panel2);font-weight:700}
.grouprow .lab i{width:9px;height:9px;border-radius:50%;background:var(--jc)}
.grouprow .track{background-image:none;cursor:default}
.cast{position:absolute;top:4px;height:20px;z-index:2;min-width:22px;border:1px solid var(--jc);border-radius:3px;
  background:color-mix(in srgb,var(--jc) 34%,var(--panel));font-size:11px;line-height:18px;padding:0 4px;white-space:nowrap;overflow:hidden;
  touch-action:none;cursor:grab}
.laneRow .cast{opacity:.93;height:16px;font-size:11px}.laneRow .cast .ic{--sz:13px}.laneRow .cast:hover{opacity:1;z-index:6}
.cast.sel{outline:2px solid var(--accent);outline-offset:1px;z-index:3}
.cast.bad{border-color:var(--warn);background:repeating-linear-gradient(135deg,var(--warn-bg) 0 4px,color-mix(in srgb,var(--jc) 20%,var(--panel)) 4px 8px)}
.cd{position:absolute;top:12px;height:4px;z-index:1;border-radius:2px;
  background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--jc) 60%,transparent) 0 3px,transparent 3px 6px)}
.ghost{position:absolute;top:26px;height:5px;z-index:1;border:1px solid var(--muted);border-radius:2px;opacity:.85;min-width:3px;pointer-events:none}
.guides{position:absolute;top:0;bottom:0;z-index:1;pointer-events:none}
.guides u{position:absolute;top:0;bottom:0;width:1px;background:var(--evc);opacity:.35;text-decoration:none}
.guides u.ph{background:var(--accent);opacity:.5;width:2px}

/* dock */
.dock{background:var(--panel);border-top:1px solid var(--line);flex:none;display:flex;flex-direction:column;max-height:32%}
.tabs{display:flex;align-items:center;gap:4px;padding:4px 16px;flex-wrap:wrap}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:4px 10px;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:700}
.tabs .sp{flex:1}
.panel{overflow:auto;padding:4px 16px 12px;min-height:0}
.dock.closed .panel{display:none}
.sum{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);margin:0 0 6px;font-size:12px}
.sum b{color:var(--fg);font-family:var(--mono)}
.tblw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:inherit}
th{font-weight:500;color:var(--muted);text-align:left;font-size:11px;padding:3px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.go{cursor:pointer}
tr.go:hover td{background:var(--panel2)}
td.t{font-family:var(--mono);white-space:nowrap}
.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.tag{font-size:11px;padding:0 6px;border-radius:3px;border:1px solid var(--evc);color:var(--evc);white-space:nowrap}
.mc{display:inline-flex;align-items:center;gap:4px;margin:1px 8px 1px 0;white-space:nowrap}
.mc i{width:8px;height:8px;border-radius:50%;background:var(--jc)}
.pct{font-family:var(--mono);font-weight:500;white-space:nowrap}
.pct.zero{color:var(--warn)}
.none{color:var(--warn)}
.ed{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.ed label{display:flex;flex-direction:column;gap:2px;color:var(--muted);font-size:11px}
.ioG{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.ioG{grid-template-columns:1fr}}
.ioG textarea{width:100%;height:120px;font-family:var(--mono);font-size:11px;resize:vertical}
.ioG .grp{margin-top:6px}
.status{color:var(--ok);font-size:12px;min-height:18px}
.hint{color:var(--muted);font-size:12px;margin:0 0 8px}
@media (max-width:640px){
  :root{--lab:92px}
  .top{padding:6px 16px;gap:6px 12px}
  .legend,.brand span{display:none}
  .tabs,.panel{padding-left:16px;padding-right:16px}
  .dock{max-height:55%}
}
@media (prefers-reduced-motion:no-preference){.cast{transition:box-shadow .12s}}

/* ===== rich skin: やわらかいパステル + 丸み + 影(こてまる風) ===== */
body{font-weight:500;-webkit-font-smoothing:antialiased}
*{scrollbar-width:thin;scrollbar-color:var(--grid2) transparent}
.top{background:var(--panel);border-bottom:0;box-shadow:var(--shadow);position:relative;z-index:20;padding:10px 20px;gap:10px 18px}
.brand{align-items:center;gap:12px}
.brand::before{content:'';width:34px;height:34px;border-radius:11px;flex:none;background:
  radial-gradient(circle at 30% 28%,#fff 0 3px,transparent 3.5px),radial-gradient(circle at 70% 30%,#ffd66b 0 3px,transparent 3.5px),radial-gradient(circle at 50% 74%,#7fe0c3 0 3px,transparent 3.5px),
  linear-gradient(135deg,var(--accent),#b06cf0);box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 40%,transparent)}
.brand h1{font-size:18px;letter-spacing:.01em}
.brand span{background:var(--panel2);border-radius:999px;padding:2px 10px;font-size:11px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px 12px;box-shadow:var(--shadow-s);transition:transform .1s,border-color .1s,box-shadow .1s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.prime{box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent)}
.chip{background:var(--panel2);border:1px solid transparent;border-radius:999px;padding:3px 12px 3px 9px;font-weight:700;transition:background .12s,border-color .12s,transform .1s}
.chip:hover{transform:translateY(-1px)}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--jc) 16%,var(--panel));border-color:color-mix(in srgb,var(--jc) 55%,transparent)}
.chip i{width:10px;height:10px;box-shadow:0 0 0 3px color-mix(in srgb,var(--jc) 22%,transparent)}
.chip[aria-pressed="false"]{opacity:.55}
select,input[type=number],input[type=text],textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px 9px}
select:focus,input:focus,textarea:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.sampleNote{background:color-mix(in srgb,var(--aoe) 14%,var(--panel));color:var(--fg);border:0;border-bottom:1px solid color-mix(in srgb,var(--aoe) 35%,transparent)}
.legend b{background:var(--panel2);border-radius:999px;padding:1px 9px}

/* palette */
.pal{background:var(--panel);border-bottom:0;box-shadow:0 6px 18px rgba(40,52,110,.05);position:relative;z-index:15;padding:8px 20px 10px}
.palHead b{font-size:13px}
.pgl{background:var(--panel2);border-radius:999px;padding:1px 9px;margin-top:1px;font-weight:700}
.pill{border:1px solid color-mix(in srgb,var(--jc) 45%,transparent);background:color-mix(in srgb,var(--jc) 14%,var(--panel));border-radius:999px;padding:0 11px 0 6px;min-height:26px;font-weight:700;box-shadow:var(--shadow-s);transition:transform .1s,box-shadow .12s}
.pill:hover{background:color-mix(in srgb,var(--jc) 26%,var(--panel));transform:translateY(-1px);box-shadow:0 4px 10px color-mix(in srgb,var(--jc) 28%,transparent)}
.pill small{border-radius:999px;border-color:color-mix(in srgb,var(--jc) 40%,transparent);color:var(--jc);font-weight:700}
.flying{border-radius:999px;box-shadow:0 10px 24px rgba(30,40,100,.3)}
.ic{border-radius:7px;background:color-mix(in srgb,var(--jc) 22%,var(--panel))}

/* timeline */
.scroller{background:var(--bg)}
.row{border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.row.sk,.row.boss{background:var(--panel)}
.row.sk:nth-of-type(even){background:color-mix(in srgb,var(--panel2) 70%,var(--panel))}
.lab{background:var(--panel);border-right:0;box-shadow:6px 0 14px -8px rgba(40,52,110,.18);font-weight:700}
.lab span.n{font-weight:700}
.ruler{background:var(--panel);box-shadow:0 6px 14px -8px rgba(40,52,110,.2)}
.ruler .lab{box-shadow:none}
.tick{font-weight:500}
.phase{top:19px;height:20px;line-height:20px;border-left:0;border-radius:999px;padding:0 12px 0 10px;background:color-mix(in srgb,var(--accent) 14%,var(--panel));color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.etime{border-left-width:2px;border-radius:2px;font-weight:500}
.ev i{height:6px;border-radius:999px;box-shadow:0 1px 4px color-mix(in srgb,var(--evc) 45%,transparent)}
.ev b{font-weight:700}
.cast{border:1px solid color-mix(in srgb,var(--jc) 50%,transparent);border-radius:8px;background:color-mix(in srgb,var(--jc) 20%,var(--panel));box-shadow:inset 3px 0 0 var(--jc),var(--shadow-s);font-weight:700;padding-left:6px;transition:box-shadow .12s,transform .1s}
.cast:hover{background:color-mix(in srgb,var(--jc) 30%,var(--panel));box-shadow:inset 3px 0 0 var(--jc),0 4px 12px color-mix(in srgb,var(--jc) 32%,transparent)}
.cast.sel{outline:2px solid var(--accent);outline-offset:2px}
.cast.bad{border-color:var(--warn);box-shadow:inset 3px 0 0 var(--warn),var(--shadow-s)}
.laneRow .cast{opacity:1;border-radius:7px}
.cd{height:5px;border-radius:999px;background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--jc) 55%,transparent) 0 4px,transparent 4px 8px)}
.ghost{border-radius:999px;border-color:var(--muted);opacity:.7}
.guides u{opacity:.22}
.guides u.ph{opacity:.4}

.mc{background:color-mix(in srgb,var(--jc) 12%,var(--panel));border-radius:999px;padding:1px 10px 1px 7px;font-weight:700}

.ed label{font-weight:700}
.ioG textarea{border-radius:12px}

#p-edit .btn{min-height:22px;padding:0 9px;font-size:11px;border-radius:8px;box-shadow:none}
td,th{padding-left:7px!important;padding-right:7px!important}
#p-list table,#p-check table{min-width:0}

.rz{position:absolute;right:0;top:0;bottom:0;width:9px;cursor:col-resize;touch-action:none}
.rz::after{content:'';position:absolute;right:3px;top:22%;bottom:22%;width:2px;border-radius:2px;background:var(--grid2);transition:background .12s}
.rz:hover::after{background:var(--accent)}
.mc{margin-right:4px;padding:0 8px 0 5px}

<div id="app">
  <header class="top">
    <div class="brand"><h1>TOP軽減ボード</h1><span>絶オメガ検証戦 / 全ジョブ対応</span></div>
    <div class="grp"><label for="mainSel">詳細表示</label><select id="mainSel"></select><button class="btn" id="foldBtn" aria-pressed="false" title="詳細表示以外のジョブの行をまとめて閉じる/開く">他ジョブを閉じる</button></div>
    <div class="grp" id="jobChips" role="group" aria-label="表示するジョブ"></div>
    <div class="grp">
      <label for="refSel">参考ログ</label>
      <select id="refSel"></select>
      <label for="refOff">ずらし(秒)</label>
      <input type="number" id="refOff" value="0" step="1">
      <button class="btn" id="refImp" title="選んでいる参考ログの軽減を取り込みます。そのジョブの今の配置はリセットされます(元に戻すで戻せます)">プランに取り込む</button>
    </div>
    <div class="grp">
      <label for="zoom">拡大</label>
      <input type="range" id="zoom" min="1.5" max="10" step="0.5" value="4">
    </div>
    <div class="grp">
      <button class="btn" id="undo">元に戻す</button>
      <button class="btn" id="redo">やり直す</button>
      <button class="btn" id="del">選択を削除</button>
      <button class="btn" id="theme">テーマ切替</button>
      <button class="btn" id="shareReset" title="共有されたプランを読み込み直します">共有プランに戻す</button>
    </div>
    <div class="legend" aria-label="凡例"><span><b>◆</b> 全体攻撃</span><span><b>▲</b> タンク攻撃</span><span><b>●</b> ギミック</span></div>
  </header>
  <section class="pal" id="pal" aria-label="スキルパレット">
    <div class="palHead"><b>スキルパレット</b><span class="palMsg" id="palMsg"></span><label class="chk" for="palAll"><input type="checkbox" id="palAll">他のジョブのスキルも出す</label><label class="chk" for="stack"><input type="checkbox" id="stack">重なりを段に分ける</label><label class="chk" for="compact"><input type="checkbox" id="compact">使っているスキルの行だけ表示</label></div>
    <div class="palBody" id="palBody"></div>
  </section>
  <p class="sampleNote" id="note" hidden><span>共有されたプラン(賢者の軽減つき)が入っています。自由にいじってOK。変更はあなたのブラウザにだけ保存されます。</span><button class="btn" id="clearSample">プランを全部消す</button></p>
  <main class="stage"><div class="scroller" id="scroller"><div class="canvas" id="cv"></div></div></main>
  <section class="dock" id="dock">
    <div class="grip" id="dockGrip" role="separator" aria-orientation="horizontal" aria-label="パネルの高さを変える(ドラッグ。ダブルクリックで元に戻す)" title="ドラッグで高さを変更 / ダブルクリックで元に戻す"><i></i></div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="check" aria-selected="true">ギミックごとの軽減</button>
      <button role="tab" data-tab="list" aria-selected="false">配置一覧</button>
      <button role="tab" data-tab="edit" aria-selected="false">ボスの時刻調整</button>
      <button role="tab" data-tab="io" aria-selected="false">保存・共有</button>
      <button role="tab" data-tab="icons" aria-selected="false">アイコン</button>
      <span class="sp"></span>
      <button class="btn" id="dockToggle" aria-expanded="true">パネルを閉じる</button>
    </div>
    <div class="panel" id="p-check"></div>
    <div class="panel" id="p-list" hidden></div>
    <div class="panel" id="p-edit" hidden></div>
    <div class="panel" id="p-io" hidden></div>
    <div class="panel" id="p-icons" hidden></div>
  </section>
</div>

    var n=normName(SK[k].en);(map[n]=map[n]||[]).push(k);

  function next(){if(++done===list.length)fin();}

    var url=URL.createObjectURL(f),img=new Image();
    img.onload=function(){
      try{var c=document.createElement('canvas');c.width=c.height=40;c.getContext('2d').drawImage(img,0,0,40,40);var du=c.toDataURL('image/png');ks.forEach(function(kk){ICONS[kk]=du;});ok++;}catch(e){miss.push(f.name);}
      URL.revokeObjectURL(url);next();
    };
    img.onerror=function(){URL.revokeObjectURL(url);miss.push(f.name);next();};
    img.src=url;
  });
}
$('#p-icons').addEventListener('change',function(e){if(e.target.id==='icFile')importIcons(e.target.files);});
$('#p-icons').addEventListener('click',function(e){
  var t=e.target;
  if(t.dataset.icdel){delete ICONS[t.dataset.icdel];saveIcons();refreshIcons();}
  else if(t.dataset.icall){ICONS={};saveIcons();refreshIcons();icSay('取り込んだ画像を消しました');}
});

/* ---- chrome ---- */
function renderChrome(){
  var lastRole=null;
  $('#jobChips').innerHTML=JOBS.map(function(j){
    var sep=(j.role&&j.role!==lastRole)?' sepL':'';lastRole=j.role||lastRole;
    return '<button class="chip'+sep+'" style="--jc:var('+j.c+')" data-job="'+j.id+'" aria-pressed="'+(!!state.jobs[j.id])+'" title="'+esc(j.ja)+'"><i></i>'+esc(j.chip||j.abbr||j.ja)+'</button>';
  }).join('');
  $('#refSel').innerHTML='<option value="0">なし</option><option value="-1"'+(state.ref<0?' selected':'')+'>世界の上位10人を重ねて表示</option><option value="-2"'+(state.ref===-2?' selected':'')+'>JPの上位(ログのある5人)を重ねて表示</option>'+REFS.map(function(r,i){return '<option value="'+(i+1)+'"'+(state.ref===i+1?' selected':'')+'>上位賢者 '+r.n+' (rDPS '+r.rdps.toLocaleString()+')</option>';}).join('');
  $('#refOff').value=state.refOff;$('#zoom').value=state.pps;
  $('#undo').disabled=!hist.u.length;$('#redo').disabled=!hist.r.length;$('#del').disabled=state.sel==null;
  $('#note').hidden=!state.sample;
  renderPalette();
  document.querySelectorAll('.tabs [data-tab]').forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===state.tab);});
  ['check','list','edit','io','icons'].forEach(function(t){$('#p-'+t).hidden=(t!==state.tab);});
  $('#dock').classList.toggle('closed',!state.open);
  $('#dockToggle').textContent=state.open?'パネルを閉じる':'パネルを開く';
  $('#dockToggle').setAttribute('aria-expanded',state.open);
}
function renderAll(){renderChrome();renderTL();renderCheck();renderList();renderIO();}

/* ---- interactions ---- */
var cv=$('#cv'),drag=null;
cv.addEventListener('click',function(e){
  if(suppressClick){suppressClick=false;return;}
  if(e.target.closest('.cast'))return;
  var go=e.target.closest('[data-go]');if(go){scrollToT(+go.dataset.go);return;}
  if(e.target.closest('.lab')||e.target.closest('.ruler'))return;
  var cr=cv.getBoundingClientRect();
  var t=Math.max(0,Math.round((e.clientX-cr.left-LAB())/state.pps));
  var tr=e.target.closest('.track[data-k]');if(!tr)return;
  var k=tr.dataset.k,id=uid();
  mutate(function(){state.plan.push({id:id,k:k,t:t});state.sel=id;});
});

/* ---- palette ---- */
function renderPalette(){
  var groups=[['P','範囲軽減'],['S','単体軽減'],['B','バリア'],['H','回復・補助']],h='';
  groups.forEach(function(g){
    var items='';
    JOBS.forEach(function(j){
      if(!state.jobs[j.id])return;
      if(!state.palAll&&j.id!==state.main)return;
      j.skills.forEach(function(s){
        if(s.k!==g[0])return;
        items+='<button type="button" class="pill'+(state.hid[s.key]?' off':'')+'" data-pk="'+s.key+'" style="--jc:var('+j.c+')" title="'+esc(j.ja+' '+s.en+' / CD'+s.cd+'秒 / 効果'+s.dur+'秒')+'">'+ico(s)+esc(s.ja)+(j.abbr?'<small>'+j.abbr+'</small>':'')+'</button>';
      });
    });
    if(items)h+='<div class="pg"><div class="pgl">'+g[1]+'</div><div class="pgi">'+items+'</div></div>';
  });
  $('#palBody').innerHTML=h;
  $('#compact').checked=state.compact;
  var m=$('#palMsg');
  if(state.armed){m.textContent='「'+SK[state.armed].ja+'」を選択中。タイムラインをクリックして置きます(Escで解除)';m.className='palMsg on';}
  else{m.textContent='ドラッグでタイムラインに置きます。クリックで、そのスキルの行を表示/非表示にします。';m.className='palMsg';}
}
(function(){var ms=$('#mainSel');ms.innerHTML=JOBS.map(function(j){return '<option value="'+j.id+'">'+j.ja+'</option>';}).join('')+'<option value="">なし(全員1行)</option>';ms.value=state.main;ms.onchange=function(){state.main=this.value;if(state.main)state.jobs[state.main]=true;save();renderChrome();renderTL();renderPalette();};})();
function syncFold(){var b=$('#foldBtn');b.textContent=state.fold?'他ジョブを開く':'他ジョブを閉じる';b.setAttribute('aria-pressed',state.fold);b.classList.toggle('prime',state.fold);}
function toggleFold(){state.fold=!state.fold;try{localStorage.setItem('top-miti-fold',state.fold?'1':'')}catch(e){}syncFold();renderTL();}
try{state.fold=localStorage.getItem('top-miti-fold')==='1';}catch(e){}
syncFold();$('#foldBtn').onclick=toggleFold;
document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('[data-fold]'))toggleFold();});
$('#stack').onchange=function(){state.stack=this.checked;try{localStorage.setItem('top-miti-stack',this.checked?'1':'')}catch(e){}renderTL();};
try{state.stack=localStorage.getItem('top-miti-stack')==='1';}catch(e){}
$('#stack').checked=state.stack;
try{state.hid=JSON.parse(localStorage.getItem('top-miti-hid')||'{}')||{};}catch(e){state.hid={};}
try{state.palAll=localStorage.getItem('top-miti-palall')==='1';}catch(e){}
$('#palAll').checked=state.palAll;
$('#palAll').onchange=function(){state.palAll=this.checked;try{localStorage.setItem('top-miti-palall',this.checked?'1':'')}catch(e){}renderPalette();};
$('#compact').onchange=function(){state.compact=this.checked;save();renderTL();};
var pd=null,fl=null,dl=null,edge=0,edgeT=null;
function inTL(e){var r=$('#scroller').getBoundingClientRect();return e.clientX>=r.left+LAB()&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;}
function dropT(e){var cr=cv.getBoundingClientRect();return Math.max(0,Math.round((e.clientX-cr.left-LAB())/state.pps));}
function stopPalDrag(){
  document.body.classList.remove('dragging');
  if(fl){fl.remove();fl=null;}if(dl){dl.remove();dl=null;}
  if(edgeT){clearInterval(edgeT);edgeT=null;}edge=0;
}
$('#palBody').addEventListener('pointerdown',function(e){
  var b=e.target.closest('.pill');if(!b||e.button>0)return;
  pd={k:b.dataset.pk,x0:e.clientX,y0:e.clientY,started:false,type:e.pointerType};
  if(e.pointerType!=='touch'){try{b.setPointerCapture(e.pointerId);}catch(err){}}
});
document.addEventListener('pointermove',function(e){
  if(!pd||pd.type==='touch')return;
  if(!pd.started){
    if(Math.abs(e.clientX-pd.x0)+Math.abs(e.clientY-pd.y0)<6)return;
    pd.started=true;document.body.classList.add('dragging');
    var s=SK[pd.k];fl=document.createElement('div');fl.className='flying';fl.style.setProperty('--jc','var('+s.job.c+')');fl.textContent=s.ja;document.body.appendChild(fl);
    edgeT=setInterval(function(){if(edge)$('#scroller').scrollLeft+=edge*14;},16);
  }
  fl.style.left=(e.clientX+12)+'px';fl.style.top=(e.clientY+12)+'px';
  var r=$('#scroller').getBoundingClientRect();
  if(inTL(e)){
    if(!dl){dl=document.createElement('div');dl.className='dl';dl.appendChild(document.createElement('span'));cv.appendChild(dl);}
    var t=dropT(e);dl.style.left=(LAB()+t*state.pps)+'px';dl.firstChild.textContent=fmt(t);
    edge=e.clientX>r.right-48?1:(e.clientX<r.left+LAB()+48?-1:0);
  }else{if(dl){dl.remove();dl=null;}edge=0;}
});
document.addEventListener('pointerup',function(e){
  if(!pd)return;var p=pd;pd=null;
  if(p.started){
    var ok=inTL(e),t=ok?dropT(e):0;stopPalDrag();
    if(ok){var id=uid();mutate(function(){state.plan.push({id:id,k:p.k,t:t});state.sel=id;if(state.hid[p.k]){delete state.hid[p.k];try{localStorage.setItem('top-miti-hid',JSON.stringify(state.hid));}catch(e){}}});}
  }else{if(state.hid[p.k])delete state.hid[p.k];else state.hid[p.k]=true;try{localStorage.setItem('top-miti-hid',JSON.stringify(state.hid));}catch(e){}renderPalette();renderTL();}
});
document.addEventListener('pointercancel',function(){pd=null;stopPalDrag();});
cv.addEventListener('pointerdown',function(e){
  var el=e.target.closest('.cast');if(!el)return;
  var id=+el.dataset.id,c=state.plan.filter(function(x){return x.id===id;})[0];if(!c)return;
  drag={id:id,x0:e.clientX,t0:c.t,el:el,moved:false,t:c.t};
  try{el.setPointerCapture(e.pointerId);}catch(err){}
  document.querySelectorAll('.cast.sel').forEach(function(n){n.classList.remove('sel');});
  el.classList.add('sel');state.sel=id;$('#del').disabled=false;
});
cv.addEventListener('pointermove',function(e){
  if(!drag)return;var dx=e.clientX-drag.x0;
  if(Math.abs(dx)>3)drag.moved=true;
  if(drag.moved){drag.t=Math.max(0,Math.round(drag.t0+dx/state.pps));drag.el.style.left=(drag.t*state.pps)+'px';drag.el.title=fmt(drag.t);}
});
function endDrag(){
  if(!drag)return;var d=drag;drag=null;
  if(d.moved&&d.t!==d.t0){mutate(function(){state.plan.forEach(function(c){if(c.id===d.id)c.t=d.t;});});}
  else renderChrome();
}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);

/* ---- つかんでスクロール(マウス/ペン) ---- */
var pan=null,suppressClick=false;
var scr=$('#scroller');
scr.addEventListener('pointerdown',function(e){
  suppressClick=false;
  if(e.button!==0||e.pointerType==='touch'||e.target.closest('.cast'))return;
  pan={x:e.clientX,y:e.clientY,sl:scr.scrollLeft,st:scr.scrollTop,on:false,id:e.pointerId};
});
scr.addEventListener('pointermove',function(e){
  if(!pan)return;
  var dx=e.clientX-pan.x,dy=e.clientY-pan.y;
  if(!pan.on){
    if(Math.abs(dx)+Math.abs(dy)<5)return;
    pan.on=true;scr.classList.add('panning');
    try{scr.setPointerCapture(pan.id);}catch(err){}
  }
  scr.scrollLeft=pan.sl-dx;scr.scrollTop=pan.st-dy;
});
function endPan(){
  if(!pan)return;
  if(pan.on){suppressClick=true;setTimeout(function(){suppressClick=false;},0);}
  scr.classList.remove('panning');pan=null;
}
scr.addEventListener('pointerup',endPan);
scr.addEventListener('pointercancel',endPan);
cv.addEventListener('dblclick',function(e){
  var el=e.target.closest('.cast');if(!el)return;var id=+el.dataset.id;
  mutate(function(){state.plan=state.plan.filter(function(c){return c.id!==id;});state.sel=null;});
});
cv.addEventListener('contextmenu',function(e){
  var el=e.target.closest('.cast');if(!el)return;e.preventDefault();var id=+el.dataset.id;
  mutate(function(){state.plan=state.plan.filter(function(c){return c.id!==id;});if(state.sel===id)state.sel=null;});
});
function scrollToT(t){var sc=$('#scroller');sc.scrollTo({left:Math.max(0,t*state.pps-sc.clientWidth/3),behavior:'smooth'});}
function delSel(){if(state.sel==null)return;var id=state.sel;mutate(function(){state.plan=state.plan.filter(function(c){return c.id!==id;});state.sel=null;});}
document.querySelector('header.top').addEventListener('click',function(e){if(e.target.closest('button,select,input,label,a,.chip'))return;if(state.sel==null&&!state.armed)return;state.sel=null;state.armed=null;renderTL();renderPalette();});
function undo(){if(!hist.u.length)return;hist.r.push(JSON.stringify(state.plan));state.plan=JSON.parse(hist.u.pop());state.sel=null;save();renderAll();}
function redo(){if(!hist.r.length)return;hist.u.push(JSON.stringify(state.plan));state.plan=JSON.parse(hist.r.pop());state.sel=null;save();renderAll();}
$('#undo').onclick=undo;$('#redo').onclick=redo;$('#del').onclick=delSel;
$('#clearSample').onclick=function(){mutate(function(){state.plan=[];state.sel=null;});};
$('#jobChips').addEventListener('click',function(e){var b=e.target.closest('[data-job]');if(!b)return;state.jobs[b.dataset.job]=!state.jobs[b.dataset.job];save();renderChrome();renderTL();});
$('#refSel').onchange=function(){state.ref=+this.value;renderTL();};
$('#refImp').onclick=function(){var b=this;function msg(t){var o=b.textContent;b.textContent=t;setTimeout(function(){b.textContent='プランに取り込む';},2200);}
  if(state.ref<=0){msg('ログを1人選んでね');return;}
  var ref=REFS[state.ref-1],n=0,rm=0,jobs={};
  ref.casts.forEach(function(c){if(SK[c.k])jobs[SK[c.k].job.id]=true;});
  mutate(function(){var before=state.plan.length;state.plan=state.plan.filter(function(c){return !(SK[c.k]&&jobs[SK[c.k].job.id]);});rm=before-state.plan.length;ref.casts.forEach(function(c){var t=c.t+state.refOff;if(t<0||!SK[c.k])return;if(state.plan.some(function(x){return x.k===c.k&&Math.abs(x.t-t)<1;}))return;state.plan.push({id:uid(),k:c.k,t:t});n++;});state.jobs.sage=true;});
  msg((rm?'既存'+rm+'件をリセットして ':'')+n+'件取り込みました');};
$('#refOff').onchange=function(){state.refOff=+this.value||0;renderTL();};
$('#zoom').oninput=function(){state.pps=+this.value;save();renderTL();};
$('#theme').onclick=function(){
  var r=document.documentElement,cur=r.getAttribute('data-theme');
  var isDark=cur?cur==='dark':!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches);
  r.setAttribute('data-theme',isDark?'light':'dark');
};
document.querySelectorAll('.tabs [data-tab]').forEach(function(b){b.onclick=function(){state.tab=b.dataset.tab;state.open=true;if(state.tab==='edit')renderEdit();if(state.tab==='icons')renderIcons();renderChrome();};});
(function(){var d=$('#dock'),g=$('#dockGrip'),KEYH='top-miti-dockh',drag=null;
  function apply(h){if(h){d.style.height=h+'px';d.style.maxHeight='none';}else{d.style.height='';d.style.maxHeight='';}}
  try{var sv=+localStorage.getItem(KEYH);if(sv>=100)apply(Math.min(sv,window.innerHeight-160));}catch(e){}
  g.addEventListener('pointerdown',function(e){drag={y:e.clientY,h:d.getBoundingClientRect().height};g.setPointerCapture(e.pointerId);document.body.classList.add('dragging');e.preventDefault();});
  g.addEventListener('pointermove',function(e){if(!drag)return;var h=Math.max(90,Math.min(window.innerHeight-160,drag.h+(drag.y-e.clientY)));apply(h);});
  function end(e){if(!drag)return;drag=null;document.body.classList.remove('dragging');try{var h=d.style.height?parseInt(d.style.height):0;localStorage.setItem(KEYH,h||'');}catch(x){}}
  g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
  g.addEventListener('dblclick',function(){apply(0);try{localStorage.setItem(KEYH,'');}catch(e){}});
  g.addEventListener('keydown',function(e){if(e.key!=='ArrowUp'&&e.key!=='ArrowDown')return;var h=d.getBoundingClientRect().height+(e.key==='ArrowUp'?40:-40);h=Math.max(90,Math.min(window.innerHeight-160,h));apply(h);try{localStorage.setItem(KEYH,Math.round(h));}catch(x){}e.preventDefault();});
  g.tabIndex=0;
})();
$('#dockToggle').onclick=function(){state.open=!state.open;renderChrome();};
$('#p-check').addEventListener('click',function(e){var r=e.target.closest('[data-go]');if(r)scrollToT(+r.dataset.go);});
$('#p-edit').addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.ps!==undefined){state.phaseStart[+t.dataset.ps]=Math.max(0,+t.value||0);}
  else if(t.dataset.ev!==undefined){var ev=state.events[+t.dataset.ev],f=t.dataset.f;
    if(f==='name')ev.name=t.value||'名称なし';else if(f==='type')ev.type=t.value;else ev[f]=+t.value||0;}
  else return;
  save();renderTL();renderCheck();
});
$('#p-edit').addEventListener('click',function(e){
  var t=e.target;
  if(t.id==='evAdd'){state.events.push({name:'新しいギミック',ph:0,pt:30,d:5,type:'aoe',dmg:0,n:1});save();renderEdit();renderTL();renderCheck();}
  else if(t.id==='evReset'){state.events=JSON.parse(JSON.stringify(DEF_EV));state.phaseStart=DEF_PS.slice();save();renderEdit();renderTL();renderCheck();}
  else if(t.dataset.evdel!==undefined){state.events.splice(+t.dataset.evdel,1);save();renderEdit();renderTL();renderCheck();}
});
$('#p-io').addEventListener('click',function(e){
  var id=e.target.id;
  if(id==='ioCopy')copyFrom($('#ioJson'),'プランをコピーしました');
  else if(id==='txtCopy')copyFrom($('#ioText'),'時刻リストをコピーしました');
  else if(id==='ioClear'){mutate(function(){state.plan=[];state.sel=null;});say('全部消しました。元に戻すで戻せます');}
  else if(id==='ioLoad'){
    try{
      var d=JSON.parse($('#ioJson').value);
      if(!d||!Array.isArray(d.plan))throw new Error('x');
      var plan=d.plan.filter(function(c){return SK[c.k]&&isFinite(c.t);});
      mutate(function(){
        state.plan=plan.map(function(c){return {id:uid(),k:c.k,t:+c.t};});
        if(Array.isArray(d.phaseStart)&&d.phaseStart.length===6)state.phaseStart=d.phaseStart.map(Number);
        if(Array.isArray(d.events)&&d.events.length)state.events=d.events;
        state.sel=null;
      });
      renderEdit();say(plan.length+'件を読み込みました');
    }catch(err){say('読み込めませんでした。コードを最初から最後までコピーして貼り付けてください');}
  }
});
document.addEventListener('keydown',function(e){
  var tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='textarea'||tag==='select')return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();}
  else if(e.key==='Escape'&&state.armed){state.armed=null;renderPalette();}
  else if(e.key==='Delete'||e.key==='Backspace'){if(state.sel!=null){e.preventDefault();delSel();}}
});

document.addEventListener('click',function(e){if(e.target&&e.target.id==='shareReset'){mutate(function(){applyShare();state.sel=null;});}});
renderEdit();renderAll();
})();
</script>
